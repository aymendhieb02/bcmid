<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#09111f"/><stop offset="1" stop-color="#183650"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#77ddd0"/></marker></defs><rect width="1200" height="400" rx="24" fill="url(#b)"/><text x="48" y="48" fill="#8ff1d9" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="2">LOCAL RESEARCH STACK</text><text x="48" y="91" fill="#fff" font-family="Arial" font-size="30" font-weight="bold">One request. A visible, evidence-aware pipeline.</text><text x="48" y="120" fill="#b3c5d8" font-family="Arial" font-size="15">A modular stack keeps orchestration and source checks inspectable.</text><g font-family="Arial"><g><rect x="48" y="160" width="220" height="170" rx="18" fill="#13263b" stroke="#3a5875"/><rect x="48" y="160" width="220" height="6" fill="#ff7184"/><text x="72" y="201" fill="#ff9aa7" font-size="12">01 · EXPERIENCE</text><text x="72" y="240" fill="#fff" font-size="23" font-weight="bold">Streamlit</text><text x="72" y="276" fill="#c1d2e3" font-size="14">Search · filters · citations</text><text x="72" y="305" fill="#829bb5" font-size="13">Interface · :8501</text></g><g><rect x="342" y="160" width="220" height="170" rx="18" fill="#13263b" stroke="#3a5875"/><rect x="342" y="160" width="220" height="6" fill="#ed82b6"/><text x="366" y="201" fill="#f9a4c8" font-size="12">02 · ORCHESTRATION</text><text x="366" y="240" fill="#fff" font-size="23" font-weight="bold">n8n</text><text x="366" y="276" fill="#c1d2e3" font-size="14">Routes · tools · response</text><text x="366" y="305" fill="#829bb5" font-size="13">Webhook · :5678</text></g><g><rect x="636" y="160" width="220" height="170" rx="18" fill="#13263b" stroke="#3a5875"/><rect x="636" y="160" width="220" height="6" fill="#55d9af"/><text x="660" y="201" fill="#81f0cb" font-size="12">03 · FEATURE TOOLS</text><text x="660" y="240" fill="#fff" font-size="23" font-weight="bold">FastAPI</text><text x="660" y="276" fill="#c1d2e3" font-size="14">Retrieve · verify · extract</text><text x="660" y="305" fill="#829bb5" font-size="13">Local API · :8000</text></g><g><rect x="930" y="145" width="220" height="200" rx="18" fill="#13263b" stroke="#3a5875"/><rect x="930" y="145" width="220" height="6" fill="#55e1ba"/><text x="954" y="187" fill="#8ee8e0" font-size="12">04 · LOCAL KNOWLEDGE</text><text x="954" y="225" fill="#fff" font-size="21" font-weight="bold">Saved assets</text><text x="954" y="257" fill="#c1d2e3" font-size="14">E5 + Chroma reports</text><text x="954" y="283" fill="#c1d2e3" font-size="14">ViT image vectors</text><text x="954" y="309" fill="#c1d2e3" font-size="14">Metadata + Ollama</text><text x="954" y="333" fill="#829bb5" font-size="12">Stay local</text></g></g><g fill="none" stroke="#77ddd0" stroke-width="3" marker-end="url(#m)"><path d="M274 245h60"/><path d="M568 245h60"/><path d="M862 245h60"/></g><text x="300" y="225" fill="#b3c5d8" font-family="Arial" font-size="11">request</text><text x="594" y="225" fill="#b3c5d8" font-family="Arial" font-size="11">tool call</text><text x="888" y="225" fill="#b3c5d8" font-family="Arial" font-size="11">local search</text><text x="48" y="374" fill="#91a9c1" font-family="Arial" font-size="13">Similar-case retrieval is research evidence; it is not a patient-level conclusion.</text></svg>