<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#202f40"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#98e5cf"/></marker></defs><rect width="1200" height="390" rx="24" fill="url(#b)"/><text x="44" y="48" fill="#8ef1d4" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="2">THE SAFETY GATE</text><text x="44" y="82" fill="#fff" font-family="Arial" font-size="27" font-weight="bold">Evidence first. Checked answer or clear abstention.</text><g font-family="Arial"><g><rect x="42" y="128" width="188" height="112" rx="16" fill="#152a40" stroke="#42627e"/><text x="61" y="161" fill="#73d9ff" font-size="12">01 · REQUEST</text><text x="61" y="192" fill="#fff" font-size="19">Question</text><text x="61" y="217" fill="#a9bbcf" font-size="13">Route by intent</text></g><g><rect x="270" y="128" width="188" height="112" rx="16" fill="#152a40" stroke="#42627e"/><text x="289" y="161" fill="#73d9ff" font-size="12">02 · RETRIEVE</text><text x="289" y="192" fill="#fff" font-size="19">Passages</text><text x="289" y="217" fill="#a9bbcf" font-size="13">Ranked + referenced</text></g><g><rect x="498" y="128" width="188" height="112" rx="16" fill="#152a40" stroke="#42627e"/><text x="517" y="161" fill="#73d9ff" font-size="12">03 · VERIFY</text><text x="517" y="192" fill="#fff" font-size="19">Evidence gate</text><text x="517" y="217" fill="#a9bbcf" font-size="13">Source + sufficiency</text></g><g><rect x="726" y="128" width="188" height="112" rx="16" fill="#152a40" stroke="#42627e"/><text x="745" y="161" fill="#73d9ff" font-size="12">04 · EXTRACT</text><text x="745" y="192" fill="#fff" font-size="19">Exact wording</text><text x="745" y="217" fill="#a9bbcf" font-size="13">Explicit fact only</text></g><g><rect x="954" y="128" width="204" height="112" rx="16" fill="#152a40" stroke="#42627e"/><text x="973" y="161" fill="#73d9ff" font-size="12">05 · CHECK</text><text x="973" y="192" fill="#fff" font-size="19">Citation checker</text><text x="973" y="217" fill="#a9bbcf" font-size="13">Verbatim + attribution</text></g></g><g fill="none" stroke="#98e5cf" stroke-width="3" marker-end="url(#m)"><path d="M234 184h31"/><path d="M462 184h31"/><path d="M690 184h31"/><path d="M918 184h31"/></g><path d="M1055 246v46H674" fill="none" stroke="#f68a9b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m)"/><rect x="438" y="266" width="286" height="65" rx="14" fill="#311f35" stroke="#a95470"/><text x="458" y="293" fill="#ff9aab" font-family="Arial" font-size="13">CHECK FAILS OR EVIDENCE IS MISSING</text><text x="458" y="316" fill="#e9cbd1" font-family="Arial" font-size="14">Withhold candidate · return abstention</text><path d="M1055 246v63h66" fill="none" stroke="#5ee2b8" stroke-width="2.5" marker-end="url(#m)"/><rect x="898" y="280" width="260" height="56" rx="14" fill="#12372f" stroke="#3d967a"/><text x="918" y="304" fill="#6ff0c2" font-family="Arial" font-size="13">CHECK PASSES</text><text x="918" y="324" fill="#d0f5e9" font-family="Arial" font-size="13">Return cited source wording</text><text x="44" y="365" fill="#8ca2ba" font-family="Arial" font-size="13">No candidate bypasses the checker. Similar reports are not facts about the submitted patient.</text></svg>