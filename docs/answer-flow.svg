<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">BCMID retrieval routes and evidence-gated response</title>
  <desc id="desc">Stable request routing and the distinct unpublished agent path both require source checks before any checked answer. Retrieval-only responses return evidence. Failed checks result in withheld candidate and abstention.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1523"/><stop offset="1" stop-color="#1b3043"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#82e4cc"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9ba9"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.s{font-size:14px;fill:#bdcddd}.t{font-size:12px;fill:#9eb2c6}.h{font-size:18px;font-weight:bold;fill:#f7f9fc}.k{font-size:12px;font-weight:bold;letter-spacing:1px}</style></defs>
  <rect width="1400" height="640" rx="28" fill="url(#bg)"/>
  <text x="48" y="48" class="k" fill="#82e4cc">REQUEST ROUTES · EVIDENCE GATE</text>
  <text x="48" y="86" font-size="29" font-weight="700" fill="#fff">Retrieve by intent. Release only checked evidence.</text>
  <text x="48" y="116" class="s">Stable path is deterministic. Agent path is a separate unpublished prototype. Both preserve the evidence boundary.</text>
  <rect x="48" y="145" width="1304" height="184" rx="20" fill="#102a35" stroke="#3a8d7b" stroke-width="2"/>
  <rect x="66" y="158" width="255" height="28" rx="14" fill="#1b594d"/><text x="82" y="178" class="k" fill="#91f2d5">STABLE · ACTIVE ROUTE</text>
  <g>
   <rect x="70" y="210" width="188" height="88" rx="14" fill="#1a2d43" stroke="#54738f"/><text x="88" y="240" class="k" fill="#a9d9ff">NORMALIZE</text><text x="88" y="269" class="h">Classify intent</text><text x="88" y="289" class="t">Validate plan allowlist</text>
   <rect x="325" y="210" width="202" height="88" rx="14" fill="#1a2d43" stroke="#54738f"/><text x="343" y="240" class="k" fill="#a9d9ff">SELECTED TOOL</text><text x="343" y="269" class="h">Report / image /</text><text x="343" y="289" class="t">combined / metadata</text>
   <rect x="595" y="210" width="202" height="88" rx="14" fill="#173c38" stroke="#50a68f"/><text x="613" y="240" class="k" fill="#8bf0cd">FASTAPI</text><text x="613" y="269" class="h">Retrieve sources</text><text x="613" y="289" class="t">Train split · provenance</text>
   <rect x="865" y="210" width="202" height="88" rx="14" fill="#24354a" stroke="#6984a2"/><text x="883" y="240" class="k" fill="#c7d8ff">SOURCE CHECK</text><text x="883" y="269" class="h">Registry + evidence</text><text x="883" y="289" class="t">Integrity · sufficiency</text>
   <rect x="1135" y="210" width="188" height="88" rx="14" fill="#342937" stroke="#9d6687"/><text x="1153" y="240" class="k" fill="#f2b7dc">RESPONSE</text><text x="1153" y="269" class="h">Evidence or</text><text x="1153" y="289" class="t">checked quotation</text>
  </g>
  <g fill="none" stroke="#82e4cc" stroke-width="3" marker-end="url(#a)"><path d="M264 254h54"/><path d="M533 254h54"/><path d="M803 254h54"/><path d="M1073 254h54"/></g>
  <text x="70" y="316" class="t">No specialist AI Agents on this active path.</text>

  <rect x="48" y="352" width="1304" height="138" rx="20" fill="#131f38" stroke="#596c99" stroke-width="2" stroke-dasharray="9 6"/>
  <rect x="66" y="365" width="400" height="28" rx="14" fill="#39456f"/><text x="82" y="385" class="k" fill="#d4dcff">PROTOTYPE · UNPUBLISHED · STRUCTURE ONLY</text>
  <rect x="72" y="414" width="245" height="54" rx="13" fill="#202c4d" stroke="#7b8ed0"/><text x="91" y="438" class="k" fill="#bfccff">ORCHESTRATOR</text><text x="91" y="458" class="s">select one relevant agent</text>
  <rect x="380" y="414" width="335" height="54" rx="13" fill="#202c4d" stroke="#7b8ed0"/><text x="399" y="438" class="k" fill="#bfccff">SPECIALISTS + API TOOLS</text><text x="399" y="458" class="s">retrieve / inspect / extract</text>
  <rect x="778" y="414" width="250" height="54" rx="13" fill="#24354a" stroke="#6984a2"/><text x="797" y="438" class="k" fill="#c7d8ff">EVIDENCE CHECKER</text><text x="797" y="458" class="s">source + answer stages</text>
  <rect x="1090" y="414" width="230" height="54" rx="13" fill="#342937" stroke="#9d6687"/><text x="1109" y="438" class="k" fill="#f2b7dc">SAFE RESPONSE</text><text x="1109" y="458" class="s">checked or abstain</text>
  <g fill="none" stroke="#9ac0ff" stroke-width="2.5" marker-end="url(#a)"><path d="M323 441h48"/><path d="M721 441h48"/><path d="M1034 441h48"/></g>

  <rect x="48" y="516" width="636" height="82" rx="16" fill="#12372f" stroke="#3d967a"/><text x="70" y="545" class="k" fill="#6ff0c2">CHECKER ACCEPTS</text><text x="70" y="573" class="h">Return only validated wording with source citations.</text>
  <rect x="716" y="516" width="636" height="82" rx="16" fill="#311f35" stroke="#a95470"/><text x="738" y="545" class="k" fill="#ff9aab">EVIDENCE MISSING OR CHECK FAILS</text><text x="738" y="573" class="h">Withhold candidate and citations; abstain safely.</text>
  <text x="48" y="624" class="t">Similar reports and images belong to training examples; they are never findings about the uploaded patient.</text>
</svg>
